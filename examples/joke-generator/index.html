<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Random Joke Generator</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="container">
    <h1>Random Joke Generator</h1>
    <div id="joke-card" class="card">
      <p id="joke-text" class="joke">Click "New Joke" to fetch one!</p>
      <div class="actions">
        <button id="new-joke">New Joke</button>
        <button id="copy-joke">Copy</button>
        <button id="share-joke">Share</button>
      </div>
    </div>
    <footer class="info">Source: <a href="https://icanhazdadjoke.com/" target="_blank" rel="noopener">icanhazdadjoke.com</a></footer>
  </main>
  <script src="script.js"></script>
</body>
</html>
