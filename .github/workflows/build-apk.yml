name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Project Dependencies
        run: |
          if [ -f "package.json" ]; then
            npm install
          elif [ -f "mobile/package.json" ]; then
            cd mobile && npm install
          fi

      - name: Generate Android Native Folder
        run: |
          if [ -f "package.json" ]; then
            npx expo prebuild --platform android --non-interactive || npx react-native-asset || true
          elif [ -f "mobile/package.json" ]; then
            cd mobile && npx expo prebuild --platform android --non-interactive || true
          fi

      - name: Build APK with Gradle
        run: |
          if [ -d "android" ]; then
            cd android
          elif [ -d "mobile/android" ]; then
            cd mobile/android
          fi
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: tawaasol-debug-apk
          path: '**/build/outputs/apk/debug/app-debug.apk'
